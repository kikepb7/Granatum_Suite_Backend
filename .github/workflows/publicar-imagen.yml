name: Publicar imagen

# The application image, published to GitHub Container Registry when a version
# is tagged on main (docs/RAMAS.md): v1.0.0 -> ghcr.io/<owner>/<repo>:1.0.0,
# :1.0 and :latest. Only tags publish; branches only build (ci.yml).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag must be the version the code says it is: tagging v1.0.1 on a
      # commit that still builds 1.0.0 would publish an image whose label lies.
      - name: Tag and project version agree
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          echo "tag=$ETIQUETA version=$VERSION"
          test "$ETIQUETA" = "v$VERSION" || { echo "::error::Tag $ETIQUETA does not match version $VERSION in build.gradle.kts"; exit 1; }
          case "$VERSION" in *SNAPSHOT*) echo "::error::A SNAPSHOT version is never published"; exit 1;; esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
