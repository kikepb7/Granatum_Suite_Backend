name: CI

# Every branch and every pull request (feature 006, FR-017): a red test must be
# visible on the branch, before anyone proposes merging it - the constitution's
# "nothing merges with CI red" needs CI to have run.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # :app:test boots the full Spring context, which needs a real Postgres.
    # Credentials and database name match the defaults in application.yml and
    # docker-compose.yml so no extra configuration is needed.
    # (The inventory integration tests do not use this service - Testcontainers
    # starts its own throwaway container via the runner's Docker daemon.)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: granatum
          POSTGRES_USER: granatum
          POSTGRES_PASSWORD: granatum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U granatum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Verifies the committed gradle-wrapper.jar against Gradle's published
      # checksums. A tampered wrapper would otherwise execute arbitrary code
      # with full access to the build and its secrets.
      - uses: gradle/actions/wrapper-validation@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build
        env:
          # application.yml has no fallback for the database password, so CI has
          # to supply it like any other environment. It matches the postgres
          # service above; it is a throwaway credential for an ephemeral
          # container, not a secret.
          DB_PASSWORD: granatum
          # JWT_SECRET_BASE64 is deliberately absent: the Gradle test tasks
          # generate a fresh key per run, so there is no signing key to store in
          # the repository or in GitHub secrets for the build to work.

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
          retention-days: 7

  # The application image (feature 006, FR-014, FR-015). Built after the tests
  # pass, never pushed from here: the point is that it builds, runs as a
  # non-root user and carries no local secrets file.
  imagen:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: granatum-suite-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user and holds no .env
        run: |
          uid=$(docker run --rm --entrypoint id granatum-suite-backend:ci -u)
          echo "uid=$uid"
          test "$uid" != "0"
          docker run --rm --entrypoint sh granatum-suite-backend:ci -c 'test ! -e /app/.env && test ! -d /app/src'

  # Branch model (docs/RAMAS.md): main is production and only takes release/*
  # and hotfix/* branches. A pull request from anything else into main fails
  # here, so a feature cannot skip develop and a release.
  politica-ramas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* and hotfix/* merge into main
        # Through env, not interpolated into the script: a branch name is
        # chosen by whoever opens the PR.
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && ! [[ "$HEAD" =~ ^(release|hotfix)/ ]]; then
            echo "::error::Into main only from release/* or hotfix/* (got '$HEAD'). See docs/RAMAS.md."
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"
