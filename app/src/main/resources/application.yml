spring:
  application:
    name: granatum-suite

  servlet:
    multipart:
      # Feature 004 uploads photos and PDFs of invoices. Spring's defaults (1 MB
      # per file, 10 MB per request) would reject any phone photo. Both limits
      # are the REQUEST's on purpose: the 10 MB per FILE is enforced by the
      # invoices service, so one oversized file comes back as DEMASIADO_GRANDE
      # while the others in the same upload are accepted. A per-file limit here
      # would fail the whole batch before reaching the controller
      # (specs/004-invoices research.md D-007, finding I1).
      max-file-size: ${INVOICES_MAX_REQUEST_SIZE:50MB}
      max-request-size: ${INVOICES_MAX_REQUEST_SIZE:50MB}

  mvc:
    async:
      # The record export streams through StreamingResponseBody, which runs as
      # an async request. Left unset, the container's own async timeout applies
      # and cuts a large export off mid-file with no visible error. Set above
      # timetracking.exportacion.timeout-segundos (120) so that, of the two, the
      # export's own limit is the one that acts.
      request-timeout: 130s

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Works as-is against docker-compose's local Postgres and against Supabase
    # (direct connection or session pooler). If you point DB_HOST at Supabase's
    # *transaction* pooler (port 6543) instead, set DB_PREPARE_THRESHOLD=0 and
    # keep DB_POOL_MAX_SIZE at or below the pooler's per-client connection limit -
    # see README.md#supabase.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:granatum}?sslmode=${DB_SSLMODE:disable}&prepareThreshold=${DB_PREPARE_THRESHOLD:5}
    username: ${DB_USERNAME:granatum}
    # No default either: principle VI names the database password as a secret,
    # and a fallback that happens to match docker-compose would still be a
    # credential living in the repository.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: GranatumHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Migrations use advisory locks and session state that Supabase's transaction
    # pooler (port 6543) does not support. Override these three only if the app's
    # main datasource above points at that pooler - point Flyway at the direct
    # connection or the session pooler (port 5432) instead. Left unset, Flyway
    # just reuses spring.datasource.*.
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}

logging:
  level:
    # Principle VI: no personal data in logs. These two Hibernate loggers print
    # entity and parameter values by reflection, so they bypass the carefully
    # written `toString()` on each entity entirely:
    #
    # - EntityPrinter dumps every persistent property of an entity, which for
    #   EmpleadoEntity means the identity document.
    # - the jdbc.bind logger prints bound statement parameters, which means
    #   every value that reaches the database, locations included.
    #
    # Pinned above DEBUG so raising the root level to diagnose a problem in
    # production cannot expose them by accident - which is exactly the scenario
    # a diagnostic session is. Found by SinDatosPersonalesEnLogsIT, which raises
    # the root logger to DEBUG on purpose to prove these survive it.
    org.hibernate.internal.util.EntityPrinter: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # No default, deliberately. A fallback here would mean a missing
  # JWT_SECRET_BASE64 in production boots the application with a signing key
  # committed to the repository - enough for anyone with a clone to forge an
  # ADMIN token. With no default the application refuses to start, which is the
  # correct failure. `./gradlew :app:bootRun` picks the value up from .env (see
  # build-logic/src/main/kotlin/DotEnv.kt); in production it comes from the
  # platform.
  secret: ${JWT_SECRET_BASE64}
  # Access token lifetime, aligned with Squadfy_Backend: 15 minutes, with the
  # refresh token (auth.refresh-expiration-days, 30) doing the long-lived part.
  # Production takes this value as-is; there is no override in
  # application-prod.yml, so JWT_EXPIRATION_MINUTES is the only knob.
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

auth:
  # Ninguno de estos valores es un secreto, asi que todos llevan defecto. El
  # unico secreto de la feature sigue siendo JWT_SECRET_BASE64, arriba, que no
  # lo lleva a proposito (principio VI).
  refresh-expiration-days: ${AUTH_REFRESH_EXPIRATION_DAYS:30}

  password:
    argon2:
      # Medido en un Mac mini de 10 nucleos: 64 MiB / t=3 cuesta ~110 ms, frente
      # a los 16 ms de los valores por defecto de Spring Security y los 217 ms de
      # BCrypt(12). RECALIBRAR en el hardware de destino antes de desplegar; el
      # procedimiento esta en specs/002-auth/research.md (apartado "Como se midio").
      memory-kb: ${AUTH_ARGON2_MEMORY_KB:65536}
      iterations: ${AUTH_ARGON2_ITERATIONS:3}
      # 1 y no 2: medido, no cambia el tiempo -Argon2 reparte la misma memoria
      # entre los carriles- y solo consumiria mas CPU del pool bajo carga.
      parallelism: ${AUTH_ARGON2_PARALLELISM:1}

  hash:
    # Techo de memoria reservada por verificaciones simultaneas: 4 x 64 MiB =
    # 256 MiB. Sin este limite, los 200 hilos por defecto de Tomcat sobre un
    # endpoint publico son 12,8 GiB que cualquiera puede provocar sin credencial.
    #
    # INVARIANT: the connection pool must be at least TWICE this value.
    # A failed sign-in holds one connection for the lockout transition (which
    # takes a row lock) while RegistradorEventosSeguridad opens a second,
    # nested transaction for the security event. With N threads past the
    # semaphore each needing two connections, a pool smaller than 2N deadlocks:
    # every thread holds one and waits for another that nobody will release.
    # Measured the hard way - 20 concurrent failures against a pool of 10 hung
    # until the connection timeout.
    # With 4 here and DB_POOL_MAX_SIZE at 10, the ceiling is 8 of 10.
    concurrencia: ${AUTH_HASH_CONCURRENCIA:4}
    # Cuanto espera un login en cola antes de recibir 503. Derivado del
    # presupuesto de 2 s de SC-011: 1 s deja un segundo entero de margen.
    espera-ms: ${AUTH_HASH_ESPERA_MS:1000}

  purga-sesiones:
    dias: ${AUTH_PURGA_SESIONES_DIAS:30}

  # Sign-up (feature 005).
  registro:
    # The ONLY secret of this block, and with no value here, ever (principle
    # VI). It lets the first ADMIN of a fresh installation sign up and get in
    # straight away, and stops working the moment any ADMIN exists. Empty means
    # bootstrap disabled. Remove it from the deployment once the first ADMIN
    # exists. See specs/005-staff-registration research.md D-002.
    codigo-arranque: ${AUTH_CODIGO_ARRANQUE:}
    # Pending requests allowed at once: sign-up is public and writes to the
    # database, so this bounds the volume however many origins it comes from.
    # The rate per origin is feature 006's (D-004).
    max-pendientes: ${AUTH_REGISTRO_MAX_PENDIENTES:50}
    caducidad-dias: ${AUTH_REGISTRO_CADUCIDAD_DIAS:7}
    caducidad-cron: ${AUTH_REGISTRO_CADUCIDAD_CRON:0 50 4 * * *}

timetracking:
  exportacion:
    # How many exports may run at once. Each holds ONE database connection for
    # as long as it streams (a single snapshot transaction, so the file is
    # coherent and two identical exports are byte-identical). Beyond this, 503
    # with Retry-After. See specs/003-timetracking-export/research.md D-002.
    concurrencia: ${TIMETRACKING_EXPORTACION_CONCURRENCIA:2}
    espera-ms: ${TIMETRACKING_EXPORTACION_ESPERA_MS:1000}
    timeout-segundos: ${TIMETRACKING_EXPORTACION_TIMEOUT_SEGUNDOS:120}
    tamano-lote: ${TIMETRACKING_EXPORTACION_TAMANO_LOTE:500}
    # Upper bound for POST /api/exportaciones/verificar, which hashes the body
    # as it reads it and never stores it. 100 MB.
    verificacion-max-bytes: ${TIMETRACKING_VERIFICACION_MAX_BYTES:104857600}

server:
  tomcat:
    # Also the WRITE timeout of a blocking response write, and that is why it is
    # set explicitly (feature 003, D-002). A record export holds a database
    # connection while it streams; a client that stops reading leaves the
    # writing thread blocked on the socket, where neither the transaction
    # timeout (it only applies to queries) nor the async request timeout frees
    # it. This one does: the blocked write fails, the export is recorded as
    # interrupted and the connection goes back to the pool. Left at Tomcat's
    # implicit 60 s, ClienteLentoExportacionIT measured 65 s of a connection
    # held by a stalled client. It also bounds how long Tomcat waits for a
    # request's headers and between keep-alive requests, for which 10 s is
    # ample for this API.
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:10s}
    # How much of a rejected request body Tomcat reads and discards before
    # answering. At its 2 MB default, an upload over the multipart limit can end
    # in a reset connection instead of the 413 (feature 004, finding T2).
    max-swallow-size: ${INVOICES_MAX_REQUEST_SIZE:50MB}

# Invoicing (feature 004). Only api-key is a secret, and it has no value here,
# ever (principle VI): empty means manual mode - invoices are stored and filled
# in by hand, nothing is sent to Claude (research.md D-006).
invoices:
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${INVOICES_CLAUDE_MODEL:claude-opus-5-5}
    effort: ${INVOICES_CLAUDE_EFFORT:medium}
  reconocimiento:
    concurrencia: ${INVOICES_RECONOCIMIENTO_CONCURRENCIA:3}
    timeout-segundos: ${INVOICES_RECONOCIMIENTO_TIMEOUT_SEGUNDOS:120}
    # Picks up invoices left pending by a restart or a failure.
    reintento-cron: ${INVOICES_REINTENTO_CRON:0 */5 * * * *}
    reintento-tras-minutos: ${INVOICES_REINTENTO_TRAS_MINUTOS:10}
  documentos:
    max-bytes-por-fichero: ${INVOICES_MAX_BYTES_POR_FICHERO:10485760}
    pdf-max-paginas: ${INVOICES_PDF_MAX_PAGINAS:20}
