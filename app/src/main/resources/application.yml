spring:
  application:
    name: granatum-suite

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Works as-is against docker-compose's local Postgres and against Supabase
    # (direct connection or session pooler). If you point DB_HOST at Supabase's
    # *transaction* pooler (port 6543) instead, set DB_PREPARE_THRESHOLD=0 and
    # keep DB_POOL_MAX_SIZE at or below the pooler's per-client connection limit -
    # see README.md#supabase.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:granatum}?sslmode=${DB_SSLMODE:disable}&prepareThreshold=${DB_PREPARE_THRESHOLD:5}
    username: ${DB_USERNAME:granatum}
    # No default either: principle VI names the database password as a secret,
    # and a fallback that happens to match docker-compose would still be a
    # credential living in the repository.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: GranatumHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Migrations use advisory locks and session state that Supabase's transaction
    # pooler (port 6543) does not support. Override these three only if the app's
    # main datasource above points at that pooler - point Flyway at the direct
    # connection or the session pooler (port 5432) instead. Left unset, Flyway
    # just reuses spring.datasource.*.
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}

logging:
  level:
    # Principle VI: no personal data in logs. These two Hibernate loggers print
    # entity and parameter values by reflection, so they bypass the carefully
    # written `toString()` on each entity entirely:
    #
    # - EntityPrinter dumps every persistent property of an entity, which for
    #   EmpleadoEntity means the identity document.
    # - the jdbc.bind logger prints bound statement parameters, which means
    #   every value that reaches the database, locations included.
    #
    # Pinned above DEBUG so raising the root level to diagnose a problem in
    # production cannot expose them by accident - which is exactly the scenario
    # a diagnostic session is. Found by SinDatosPersonalesEnLogsIT, which raises
    # the root logger to DEBUG on purpose to prove these survive it.
    org.hibernate.internal.util.EntityPrinter: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # No default, deliberately. A fallback here would mean a missing
  # JWT_SECRET_BASE64 in production boots the application with a signing key
  # committed to the repository - enough for anyone with a clone to forge an
  # ADMIN token. With no default the application refuses to start, which is the
  # correct failure. `./gradlew :app:bootRun` picks the value up from .env (see
  # build-logic/src/main/kotlin/DotEnv.kt); in production it comes from the
  # platform.
  secret: ${JWT_SECRET_BASE64}
  # Access token lifetime, aligned with Squadfy_Backend: 15 minutes, with the
  # refresh token (auth.refresh-expiration-days, 30) doing the long-lived part.
  # Production takes this value as-is; there is no override in
  # application-prod.yml, so JWT_EXPIRATION_MINUTES is the only knob.
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

auth:
  # Ninguno de estos valores es un secreto, asi que todos llevan defecto. El
  # unico secreto de la feature sigue siendo JWT_SECRET_BASE64, arriba, que no
  # lo lleva a proposito (principio VI).
  refresh-expiration-days: ${AUTH_REFRESH_EXPIRATION_DAYS:30}

  password:
    argon2:
      # Medido en un Mac mini de 10 nucleos: 64 MiB / t=3 cuesta ~110 ms, frente
      # a los 16 ms de los valores por defecto de Spring Security y los 217 ms de
      # BCrypt(12). RECALIBRAR en el hardware de destino antes de desplegar; el
      # procedimiento esta en specs/002-auth/research.md (apartado "Como se midio").
      memory-kb: ${AUTH_ARGON2_MEMORY_KB:65536}
      iterations: ${AUTH_ARGON2_ITERATIONS:3}
      # 1 y no 2: medido, no cambia el tiempo -Argon2 reparte la misma memoria
      # entre los carriles- y solo consumiria mas CPU del pool bajo carga.
      parallelism: ${AUTH_ARGON2_PARALLELISM:1}

  hash:
    # Techo de memoria reservada por verificaciones simultaneas: 4 x 64 MiB =
    # 256 MiB. Sin este limite, los 200 hilos por defecto de Tomcat sobre un
    # endpoint publico son 12,8 GiB que cualquiera puede provocar sin credencial.
    #
    # INVARIANT: the connection pool must be at least TWICE this value.
    # A failed sign-in holds one connection for the lockout transition (which
    # takes a row lock) while RegistradorEventosSeguridad opens a second,
    # nested transaction for the security event. With N threads past the
    # semaphore each needing two connections, a pool smaller than 2N deadlocks:
    # every thread holds one and waits for another that nobody will release.
    # Measured the hard way - 20 concurrent failures against a pool of 10 hung
    # until the connection timeout.
    # With 4 here and DB_POOL_MAX_SIZE at 10, the ceiling is 8 of 10.
    concurrencia: ${AUTH_HASH_CONCURRENCIA:4}
    # Cuanto espera un login en cola antes de recibir 503. Derivado del
    # presupuesto de 2 s de SC-011: 1 s deja un segundo entero de margen.
    espera-ms: ${AUTH_HASH_ESPERA_MS:1000}

  purga-sesiones:
    dias: ${AUTH_PURGA_SESIONES_DIAS:30}
