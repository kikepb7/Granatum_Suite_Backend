spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  # Same as Squadfy_Backend: a long default for local work, but a *default* -
  # JWT_EXPIRATION_MINUTES still wins. Note that `.env.example` sets it to 15, so
  # anyone who follows the README runs dev at 15 minutes, which is the useful
  # setting for exercising token renewal.
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1000}

logging:
  level:
    com.granatum: DEBUG

# The OpenAPI document and its UI are on while developing (feature: springdoc).
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
