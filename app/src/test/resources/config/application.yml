# Test-only overrides for app's Spring contexts.
#
# In config/ and not at the classpath root ON PURPOSE: Spring merges
# classpath:/config/application.yml over classpath:/application.yml, whereas a
# test application.yml at the root would REPLACE production's whole file
# (specs/004-invoices, finding S2).

invoices:
  claude:
    # A literal empty value: no test of app ever calls the real Claude API, even
    # with ANTHROPIC_API_KEY in .env - which Gradle loads into every test task.
    # The real client is built only from this property, never from the SDK's
    # own credential lookup (research.md D-006). NoRealApiCallsInTestsIT
    # guards it.
    api-key: ""

sheets:
  google:
    # Same reason as the Claude key above: a literal empty value, so a
    # GOOGLE_SHEETS_CREDENTIALS_FILE in .env never reaches the suite and no test
    # of app writes in a real spreadsheet (specs/012-google-sheets-sync, D-009).
    credentials-file: ""

# Feature 006. Every app test talks to the server from 127.0.0.1, so with the
# production quotas the suite would trip the limiter on itself. The limiter
# tests lower these with @TestPropertySource.
security:
  rate-limits:
    login: 1000000/1m
    session: 1000000/1m
    sign-up: 1000000/1m
    general: 1000000/1m
