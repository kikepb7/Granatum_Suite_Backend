[versions]
kotlin = "2.2.0"
spring-boot = "4.0.0-SNAPSHOT"
spring-dependency-management = "1.1.7"
# Aligned with the jackson-databind the build already resolved (2.20.1) when
# the Anthropic SDK came in, which needs >= 2.19.4: until then jsr310 sat at
# 2.17.0 next to a 2.20.1 databind. Feature 004, tasks.md T003.
jackson = "2.20.1"
jakarta = "6.1.0"
jwt = "0.12.6"
mockk = "1.13.13"
testcontainers = "1.20.4"
# El BOM de Spring Boot 4 NO gestiona BouncyCastle (comprobado sobre
# spring-boot-dependencies-4.0.0-SNAPSHOT.pom), asi que la version va aqui a mano.
bouncycastle = "1.79"
anthropic = "2.69.0"
pdfbox = "3.0.8"
# Must match the OkHttp the Anthropic SDK brings (4.x), or the mock server and
# the client disagree on the wire classes.
okhttp = "4.12.0"
# The 3.0.x line is built against Spring Boot 4.0 (parent 4.0.5); 3.1.x moved to
# Boot 4.1, which this project is not on.
springdoc = "3.0.3"

[libraries]
# Spring Boot Starters
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# JWT
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta" }
jwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jwt" }
jwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwt" }
jwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwt" }

# Jackson
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
# Spring Boot 4's web layer uses Jackson 3, which lives in the `tools.jackson`
# namespace. The Jackson 2 module above does nothing for it, so without this one
# Jackson cannot use a Kotlin data class's primary constructor and every request
# body fails to deserialize. Version comes from tools.jackson:jackson-bom, which
# the Boot BOM already manages.
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson-datatype = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }

# Database
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Boot 4 ships auto-configuration in per-technology modules, so flyway-core
# alone does not wire Flyway up - without this the migrations never run and
# Hibernate's `ddl-auto: validate` fails on the missing tables.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }

# Criptografia
# Argon2PasswordEncoder de Spring Security delega en BouncyCastle: su bytecode
# referencia org.bouncycastle.crypto.generators.Argon2BytesGenerator, asi que sin
# este jar en runtime el bean de PasswordEncoder falla al construirse.
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Test
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }

# Invoicing (feature 004)
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
